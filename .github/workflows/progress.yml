name: Progress

on:
  push:
    paths:
      - 'src/**'
      - 'include/**'
      - 'config/**'
      - 'configure.py'
      - 'tools/**'
      - '.github/workflows/progress.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: progress-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # BUILD_IMAGE has the discs in /orig
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.BUILD_IMAGE != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ vars.BUILD_IMAGE }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Prepare originals
        run: cp -a /orig/. orig/
      - name: Build and record progress
        run: python3 tools/progress.py update --version GGTE01 --version GGTJ01_01 --version GGTP01
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-progress
          path: progress/data.json
          if-no-files-found: error

  render:
    needs: build
    if: >-
      always() && !cancelled() &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.snapshot.outputs.ready }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.build.result == 'success'
        with:
          name: verified-progress
          path: progress
      - name: Fetch last published snapshot
        if: needs.build.result != 'success'
        run: |
          mkdir -p progress
          if git fetch --depth 1 origin gh-pages; then
            git show FETCH_HEAD:data.json > progress/data.json || rm -f progress/data.json
          fi
      - name: Check snapshot
        id: snapshot
        run: |
          if [ -f progress/data.json ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo '::notice::No progress snapshot yet, nothing to publish.'
          fi
      - name: Render badges, README image and treemap
        if: steps.snapshot.outputs.ready == 'true'
        run: |
          python tools/progress.py render --output site
          cp progress/data.json site/data.json
          touch site/.nojekyll
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.snapshot.outputs.ready == 'true'
        with:
          name: progress-site
          path: site
          include-hidden-files: true
          if-no-files-found: error

  publish:
    needs: render
    if: always() && !cancelled() && needs.render.result == 'success' && needs.render.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check branch has not moved
        id: head
        env:
          EXPECTED_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(git ls-remote "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "refs/heads/${DEFAULT_BRANCH}" | cut -f1)
          if [ "$current" = "$EXPECTED_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.head.outputs.current == 'true'
        with:
          name: progress-site
          path: site
      - name: Push to gh-pages
        if: steps.head.outputs.current == 'true'
        working-directory: site
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git init -q -b gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "progress for ${SOURCE_SHA}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" gh-pages
