name: Progress

on:
  push:
    paths:
      - 'src/**'
      - 'include/**'
      - 'config/**'
      - 'configure.py'
      - 'tools/**'
      - '.github/workflows/progress.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: progress-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Runs on a self-hosted runner that has the discs locally, so the game never
  # leaves that machine. The runner's .env sets CHIBIROBO_ORIG to its orig/ folder.
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, chibirobo-orig]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Prepare originals
        run: |
          if [ -z "$CHIBIROBO_ORIG" ] || [ ! -d "$CHIBIROBO_ORIG" ]; then
            echo '::error::CHIBIROBO_ORIG is not set to the discs folder in the runner .env'
            exit 1
          fi
          cp -a "$CHIBIROBO_ORIG/." orig/
      - name: Build and record progress
        run: python3 tools/progress.py update --version GGTE01 --version GGTJ01_01 --version GGTP01
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-progress
          path: progress/data.json
          if-no-files-found: error

  render:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-progress
          path: progress
      - name: Render badges, README image and treemap
        run: |
          python tools/progress.py render --output site
          cp progress/data.json site/data.json
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
          include-hidden-files: true

  publish:
    needs: render
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check branch has not moved
        id: head
        env:
          EXPECTED_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(git ls-remote "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "refs/heads/${DEFAULT_BRANCH}" | cut -f1)
          if [ "$current" = "$EXPECTED_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo '::notice::A newer commit is waiting, leaving the site alone.'
          fi
      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.head.outputs.current == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
